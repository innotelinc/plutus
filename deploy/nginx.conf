server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed static assets can be cached forever.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSO endpoints live on the Convex site proxy (:3211). Proxying /auth/*
    # here keeps the session cookie on the app origin, so SameSite=Lax works
    # over plain HTTP on the LAN.
    location /auth/ {
        proxy_pass http://backend:3211;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fallback video clips generated by the pipeline when MuAPI is unavailable.
    location /fallback-clips/ {
        alias /fallback-clips/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
