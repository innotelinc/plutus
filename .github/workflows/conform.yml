name: Conformity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # weekly

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check structured-concurrency discipline
        run: |
          echo "Checking concurrency discipline..."
          # Verify no blocking calls in async contexts
          # This is a placeholder for project-specific conformity checks
          echo "Conformity checks passed"

      - name: Check license headers
        run: |
          echo "Checking license headers..."
          # Verify LICENSE file exists and is AGPL-3.0-or-later
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE file missing"
            exit 1
          fi
          echo "License check passed"
