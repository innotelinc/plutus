name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: http://192.168.1.10:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://192.168.1.10:3211

      - name: Package static export
        run: |
          cd out
          tar czf ../plutus-static-${{ github.ref_name }}.tar.gz .

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: plutus-static-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
        if: startsWith(github.ref, 'refs/tags/')
