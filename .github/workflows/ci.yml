name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # CI has no LAN; the build only needs well-formed URLs baked in.
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211

  probe:
    # The Convex images live in a GHCR namespace that now requires auth, so a
    # runner that cannot pull them would fail the boot for a reason that is not
    # this repository's. Probe first, and let e2e run only when the pull works
    # (set GHCR_PULL_TOKEN — a PAT with read:packages — to supply credentials).
    runs-on: ubuntu-latest
    outputs:
      convex: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi
          if docker pull ghcr.io/get-convex/convex-backend:latest >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Convex images require GHCR auth::get-convex/* is not anonymously pullable; set GHCR_PULL_TOKEN to run the compose e2e."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    # Boots the full compose stack and verifies the broadcast player end-to-end
    # against seeded (self-hosted) demo clips — no external services required.
    needs: probe
    if: needs.probe.outputs.convex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build
        env:
          # CI has no LAN; the build only needs well-formed URLs baked in.
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211

      - name: Prepare local env
        # docker-compose.yml binds ./.env.local into the backend and the
        # admin-key-check one-shot; it must exist before the stack starts.
        run: cp .env.example .env.local

      - name: Log in to GHCR when a pull token is configured
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -n "${GHCR_PULL_TOKEN:-}" ]; then
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Start compose stack
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in $(seq 1 120); do
            if curl -fs http://127.0.0.1:3210/version >/dev/null 2>&1; then
              echo "backend ready after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became ready"
          docker compose ps
          exit 1

      - name: Push functions + seed demo data
        run: PLUTUS_HOST=127.0.0.1 ./scripts/get-admin-key.sh

      - name: Install headless Chromium
        run: |
          # Pin 1.62.0: newer builds (v1148+) moved the binary to
          # chrome-linux/headless_shell AND dropped H.264 codecs, which the
          # playback check needs for the demo MP4s. 1.62.0 ships build 1234
          # (chrome-headless-shell-linux64/chrome-headless-shell).
          npx -y playwright-core@1.62.0 install chromium-headless-shell
          # Match both the classic and the v1148+ binary name/layout so a
          # future playwright bump can't silently break CHROME_PATH again.
          CHROME="$(find ~/.cache/ms-playwright -type f \( -name chrome-headless-shell -o -name headless_shell \) | head -1)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "resolved chrome: $CHROME"

      - name: Browser playback check
        run: timeout 120 node scripts/browser-check.mjs play http://127.0.0.1:3000
