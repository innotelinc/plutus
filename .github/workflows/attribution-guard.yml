# ═══════════════════════════════════════════════════════════════════════════
# attribution-guard.yml — enforce the attribution policy on every push and PR.
#
# Policy: no credit is given to anyone but Darnel Hunter <dhunter@innotel.us>.
# The guard rejects attribution text (Co-Authored-By/Signed-off-by trailers
# naming anyone else, "Generated with/by <AI tool>", credit lines) in:
#   - commit messages introduced by this push/PR,
#   - the PR title/body (pull requests),
#   - lines added to any file in the push/PR.
#
# The actual patterns live in .githooks/guard-lib (shared with the local
# commit-msg/pre-commit hooks), so this workflow just sources that file and
# feeds it the streams above. It never inspects author/committer identity.
# ═══════════════════════════════════════════════════════════════════════════

name: Attribution guard

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  guard:
    name: Check attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages, PR text, and file changes
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -euo pipefail

          # ── helpers ────────────────────────────────────────────────────────
          reject() {
            echo "::error::$1"
            EXIT_CODE=1
          }

          # ── source the shared guard patterns ────────────────────────────────
          # (.githooks/guard-lib is committed to this repo verbatim from
          #  innotel-platform-stack — see docs/standard.md §5)
          if [ ! -f .githooks/guard-lib ]; then
            echo "::warning::.githooks/guard-lib missing — skipping attribution check"
            exit 0
          fi
          # shellcheck disable=SC1091
          . .githooks/guard-lib

          EXIT_CODE=0

          # A brand-new ref (branch/tag creation) reports all-zeros as the
          # base — there is no previous revision to diff against, and git
          # treats 000..0..HEAD as an invalid range.
          ZERO_SHA=0000000000000000000000000000000000000000
          HAS_BASE=0
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "${HEAD_SHA:-}" ] && [ "${BASE_SHA}" != "${ZERO_SHA}" ]; then
            HAS_BASE=1
          fi

          # ── commit messages (push) ──────────────────────────────────────────
          if [ "$HAS_BASE" = "1" ]; then
            git log --format='%H %s' "${BASE_SHA}..${HEAD_SHA}" | cut -d' ' -f2- | \
              while IFS= read -r msg; do
                [ -z "$msg" ] && continue
                # guard-lib provides check_commit_msg <msg> -> 0|1
                if check_commit_msg "$msg"; then
                  reject "Commit message contains attribution: $msg"
                fi
              done
          fi

          # ── PR title + body ────────────────────────────────────────────────
          if [ -n "${PR_TITLE:-}" ]; then
            if check_commit_msg "$PR_TITLE"; then
              reject "PR title contains attribution: $PR_TITLE"
            fi
          fi
          if [ -n "${PR_BODY:-}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if check_commit_msg "$line"; then
                reject "PR body contains attribution: $line"
              fi
            done <<< "$PR_BODY"
          fi

          # ── lines added to files ───────────────────────────────────────────
          if [ "$HAS_BASE" = "1" ]; then
            git diff --diff-filter=AM --unified=0 "${BASE_SHA}".."${HEAD_SHA}" | \
              grep '^+' | grep -v '^+++' | \
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                # strip the leading +
                str="${line#+}"
                if check_commit_msg "$str"; then
                  reject "Added line contains attribution: $str"
                fi
              done
          fi

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Attribution guard failed — see errors above."
            exit 1
          fi
          echo "Attribution guard: passed."
