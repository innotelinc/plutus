# ─── Production overlay ─────────────────────────────────────────────────────
#
# Use with:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Overrides:
#   - ADMIN_SECRET set to a real secret (change before deploying)
#   - Admin key check fails the deploy on mismatch (not warn-only)
#   - All URLs use the production LAN IP (not localhost)

services:
  backend:
    environment:
      - ADMIN_SECRET=${ADMIN_SECRET:-change-me-to-a-real-secret-in-production}

  dashboard:
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://192.168.1.10:${PORT:-3210}

  admin-key-check:
    environment:
      # Do NOT set GLIZ_ADMIN_KEY_CHECK_WARN_ONLY in production — mismatches
      # should block the deploy so stale credentials don't go live.
      - GLIZ_ADMIN_KEY_CHECK_WARN_ONLY=
